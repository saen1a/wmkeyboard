name: Agent pack

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: agent-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify agent pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: python -m pip install 'PyYAML>=6'

      # The vendored tree hash, fragment hashes, neutral and Kilo renders, skill
      # copies, scoped permissions, and project content all have to agree.
      - name: Verify
        run: python scripts/verify-agent-pack.py
