name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Every channel flag off: this is the plain sideload build, so no Google
  # binary is on the compile classpath and CI never needs a Play SDK.
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # The test tasks build native/wm-engine-jni for this runner first
      # (build-host.sh), so the JVM suites and the prediction and glide evals
      # run the real Rust engine. The runner image has cargo; this keeps its
      # build between runs, and the engine's own test build.
      - name: Cache the Rust engine's host build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/wm-engine
            native/wm-engine-jni

      # The engine's own tests (the glide join and frequency-weight ones
      # among them), which no Gradle task runs.
      - name: Test the Rust engine
        run: cargo test --release --manifest-path native/wm-engine/Cargo.toml

      - name: Run unit tests
        # `unitTests` and not a bare testIntlDebugUnitTest: :app carries the
        # `languages` flavour and the library modules do not, so no single
        # flavoured task name reaches both. The aggregate in the root build
        # does.
        run: ./gradlew unitTests -Pwmkb.skipBenchmarks=true --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  # The Rust glide engine has two artifacts no other job verifies together:
  # the host library the JVM parity test loads, and the real Android .so the
  # APK must carry. Both are built here from the same pinned Rust (1.99.1).
  #
  # Android .so: NDK r29 (29.0.14206865), API 24, ABIs arm64-v8a, armeabi-v7a
  # and x86_64, built by native/wm-engine-jni/build.sh (cargo-ndk 4.1.2) into
  # core/language/src/main/jniLibs/. The debug APK filters to arm64-v8a, so
  # only that ABI is inside it; all three are verified on disk and uploaded.
  #
  # Host parity, reproducible locally with Rust 1.99.1 installed:
  #   ./gradlew :app:testIntlDebugUnitTest \
  #     --tests 'com.wasimaster.wmkeyboard.core.gesture.NativeGlideParityTest'
  # A host without the NDK (or an MSVC linker on Windows) builds only the host
  # library with native/wm-engine-jni/build-host.sh and points the test at it
  # with -Dwmkeyboard.engine.lib=<path> or WM_ENGINE_LIB. A GNU-built
  # wm_engine_jni.dll is the verified local fallback there; it is never an
  # Android artifact and is never uploaded.
  native-engine:
    name: Native glide engine (host parity + Android .so)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ABIS: arm64-v8a armeabi-v7a x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Set up Rust 1.99.1
        run: |
          rustup toolchain install 1.99.1 --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=1.99.1" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native/wm-engine
            native/wm-engine-jni
          key: native-engine

      # buildHostEngine runs as a dependency of :app's test task and writes
      # native/wm-engine-jni/target/release/libwm_engine_jni.so. Naming it
      # through WM_ENGINE_LIB makes the test load exactly that file instead of
      # searching upward, so a stale or wrong-ELF library fails loudly.
      - name: Host glide parity
        env:
          WM_ENGINE_LIB: ${{ github.workspace }}/native/wm-engine-jni/target/release/libwm_engine_jni.so
        run: |
          ./gradlew :app:testIntlDebugUnitTest \
            --tests 'com.wasimaster.wmkeyboard.core.gesture.NativeGlideParityTest' \
            -Pwmkb.skipBenchmarks=true --stacktrace
          test -s "$WM_ENGINE_LIB"

      - name: NDK r29
        run: |
          ndk=$ANDROID_SDK_ROOT/ndk/29.0.14206865
          if [ ! -d "$ndk" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" > /dev/null
          fi
          echo "ANDROID_NDK=$ndk" >> "$GITHUB_ENV"

      # The release APK uses the committed jniLibs, while this job builds a
      # fresh copy below. Check the committed files first: a stale library
      # without glideTuningVersion silently drops the new lift/preview budgets.
      - name: Verify the committed jniLibs carry the new tuning symbol
        run: |
          nm=$(ls "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin/llvm-nm)
          symbol=Java_com_wasimaster_wmkeyboard_core_prediction_PredictionNative_glideTuningVersion
          for abi in $ABIS; do
            so=core/language/src/main/jniLibs/$abi/libwm_engine_jni.so
            [ -s "$so" ] || { echo "::error::missing committed $so"; exit 1; }
            "$nm" -D --defined-only "$so" | grep -q "$symbol" \
              || { echo "::error::$so is stale (no $symbol); rebuild with native/wm-engine-jni/build.sh"; exit 1; }
          done

      - name: Build the Android JNI bridge for all three ABIs
        env:
          WMKB_ABIS: ${{ env.ABIS }}
        run: native/wm-engine-jni/build.sh

      # The versioned envelope, the unversioned 32-value array and the old
      # thirty-value array are the three layouts glide.rs accepts. These host
      # tests are the old-library fallback's proof; the .so only has to export
      # glideTuningVersion, checked in the next step.
      - name: Verify the glide tuning layouts
        run: cargo test --release --locked --manifest-path native/wm-engine-jni/Cargo.toml

      - name: Verify each ABI and its glideTuningVersion export
        run: |
          readelf=$(ls "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          nm=$(ls "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin/llvm-nm)
          symbol=Java_com_wasimaster_wmkeyboard_core_prediction_PredictionNative_glideTuningVersion
          for abi in $ABIS; do
            so=core/language/src/main/jniLibs/$abi/libwm_engine_jni.so
            [ -s "$so" ] || { echo "::error::missing $so"; exit 1; }
            machine=$("$readelf" -h "$so" | awk -F': *' '/Machine:/{print $2}')
            case "$abi:$machine" in
              arm64-v8a:AArch64 | armeabi-v7a:ARM | x86_64:*X86-64*) ;;
              *) echo "::error::$so is $machine, wrong for $abi"; exit 1 ;;
            esac
            "$nm" -D --defined-only "$so" | grep -q "$symbol" \
              || { echo "::error::$so does not export glideTuningVersion"; exit 1; }
            echo "$abi ok: $machine, $symbol"
          done

      - name: Assemble the intl debug APK
        run: ./gradlew assembleIntlDebug --stacktrace

      - name: Verify the APK carries the rebuilt arm64 library
        run: |
          apk=$(ls app/build/outputs/apk/intl/debug/*.apk | head -1)
          [ -n "$apk" ] || { echo "::error::no intl debug APK"; exit 1; }
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/libwm_engine_jni.so' \
            || { echo "::error::$apk has no arm64 libwm_engine_jni.so"; exit 1; }
          unzip -p "$apk" lib/arm64-v8a/libwm_engine_jni.so > "$RUNNER_TEMP/apk-libwm_engine_jni.so"
          readelf=$(ls "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          "$readelf" -h "$RUNNER_TEMP/apk-libwm_engine_jni.so" | grep -q AArch64 \
            || { echo "::error::APK library is not AArch64"; exit 1; }
          echo "APK library: $(wc -c < "$RUNNER_TEMP/apk-libwm_engine_jni.so") bytes"

      - name: Checksums
        run: |
          mkdir -p dist/native-engine
          for abi in $ABIS; do
            cp "core/language/src/main/jniLibs/$abi/libwm_engine_jni.so" \
              "dist/native-engine/libwm_engine_jni-$abi.so"
          done
          cp "$RUNNER_TEMP/apk-libwm_engine_jni.so" \
            dist/native-engine/libwm_engine_jni-apk-arm64-v8a.so
          (cd dist/native-engine && sha256sum *.so > SHA256SUMS)

      - name: Upload the APK and the engine libraries
        uses: actions/upload-artifact@v7
        with:
          name: native-engine-intl-debug
          path: |
            app/build/outputs/apk/intl/debug/*.apk
            dist/native-engine/
          retention-days: 7

  # Three jobs on separate runners at the same time. The English build is here
  # to prove the localeFilters path still packages, which nothing else would
  # catch before a release was already being cut. The F-Droid one compiles
  # with -Pwmkb.enableFdroid=true, which swaps in the src/nogoogle stand-ins
  # for the ML Kit code and drops Google's SDKs: the only build that compiles
  # them, so the only place a broken stand-in shows up before F-Droid's own
  # build fails.
  assemble:
    name: Assemble ${{ matrix.build }} ${{ matrix.language }} debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { build: standard, language: intl }
          - { build: standard, language: en }
          - { build: fdroid, language: intl }
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Capitalised: assembleIntlDebug, assembleEnDebug. AGP names the output
      # directory after the flavour: app/build/outputs/apk/intl/debug/.
      - name: Assemble
        run: |
          language='${{ matrix.language }}'
          flags=()
          [ '${{ matrix.build }}' = fdroid ] && flags+=(-Pwmkb.enableFdroid=true)
          ./gradlew "assemble${language^}Debug" "${flags[@]}" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ matrix.build }}-${{ matrix.language }}-debug
          path: app/build/outputs/apk/${{ matrix.language }}/debug/*.apk
          retention-days: 7

  # ART never compiles a method of 10,000 dex instructions or more, and runs
  # one with a frame over 3 KB in its slow interpreter until the JIT gets to
  # it. Nothing else notices either: the keyboard just types slower. Reads the
  # dex of a `fast` build (release-mode d8, no R8, so the names are readable).
  # English only, because the dex is the same in both language flavours.
  dex-limits:
    name: Dex method limits
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Check method sizes
        run: ./gradlew :app:checkDexMethodsEnFast --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dex-methods
          path: app/build/reports/dex-methods/
          retention-days: 7

  # Every library the APK ships, against the licences app/build.gradle.kts
  # allows. Two builds because the answer differs: the standard one carries
  # ML Kit under Google's terms, and an F-Droid build must carry nothing but
  # free licences, which the F-Droid flag makes the allow list enforce.
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Standard
        run: ./gradlew :app:licenseeAndroidIntlRelease --stacktrace

      - name: As F-Droid builds it
        run: ./gradlew :app:licenseeAndroidIntlRelease -Pwmkb.enableFdroid=true --stacktrace

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: licensee
          path: app/build/reports/licensee/
          retention-days: 7

  # Accuracy floors move when a dictionary or a ranking weight changes, which
  # is a review conversation and not a merge blocker. Reported, never gating.
  eval:
    name: Prediction & gesture evals (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      # Scoped to :app because that is where the eval suites live. An
      # unqualified task name would run the filter against every module too,
      # and a Test task whose --tests filter matches nothing fails the build.
      - name: Run evals
        run: >
          ./gradlew :app:testIntlDebugUnitTest
          --tests '*.prediction.eval.*' --tests '*.gesture.eval.*'
          -Pwmkb.skipBenchmarks=true --stacktrace

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - run: npm ci
        working-directory: docs

      # CHECK_LINKS=1 turns on starlight-links-validator, so a broken internal
      # link fails here instead of shipping to Pages.
      - run: npm run check
        working-directory: docs
